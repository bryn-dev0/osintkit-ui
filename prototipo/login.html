<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — OsintKit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="encabezado">
    <div class="contenedor encabezado__inner">
      <a class="marca" href="login.html">OsintKit</a>
    </div>
  </header>

  <main class="contenedor principal">
    <section class="seccion">
      <h1>Iniciar sesión</h1>
      <form class="formulario" action="dashboard.html" method="get">
        <div class="campo">
          <label for="correo">Correo institucional</label>
          <input type="email" id="correo" name="correo" required>
        </div>
        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" required>
        </div>
        <div class="alerta" hidden>Correo y contraseña son obligatorios.</div>
        <div class="boton-grupo">
          <button type="submit" class="boton">Ingresar</button>
          <a class="boton boton-secundario" href="registro.html">Crear cuenta</a>
        </div>
        <p><a href="recuperar.html">¿Olvidaste tu contraseña?</a></p>
      </form>
    </section>
  </main>

  <footer class="pie">
    <div class="contenedor"><small>OsintKit — prototipo baja fidelidad</small></div>
  </footer>

  <script>
document.querySelector("form").addEventListener("submit", function (e) {
  e.preventDefault();
  var correo = document.getElementById("correo").value.trim();
  var clave = document.getElementById("contrasena").value.trim();
  var error = document.querySelector(".alerta") || document.querySelector(".mensaje-error");

  if (!correo || !clave) {
    if (error) {
      error.textContent = "Correo y contraseña son obligatorios.";
      error.hidden = false;
    } else {
      alert("Correo y contraseña son obligatorios.");
    }
    return;
  }
  if (error) error.hidden = true;
  alert("Datos completos (prototipo, sin autenticación real).");
});
</script>
</body>
</html>
