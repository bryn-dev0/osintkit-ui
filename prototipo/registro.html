<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro — OsintKit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="encabezado">
    <div class="contenedor encabezado__inner">
      <a class="marca" href="login.html">OsintKit</a>
    </div>
  </header>

  <main class="contenedor principal">
    <section class="seccion">
      <h1>Registro de usuario</h1>
      <form class="formulario" action="login.html" method="get">
        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" required>
        </div>
        <div class="campo">
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" required>
        </div>
        <div class="campo">
          <label for="rol">Rol</label>
          <select id="rol" name="rol" required>
            <option value="">Seleccione un rol</option>
            <option value="junior">Analista Junior</option>
            <option value="auditor">Auditor</option>
            <option value="admin">Administrador</option>
          </select>
        </div>
        <div class="campo">
          <label>
            <input type="checkbox" id="terminos" name="terminos" required>
            Acepto los términos y condiciones
          </label>
        </div>
        <div class="alerta">El correo no debe estar registrado y debe aceptar los términos y condiciones.</div>
        <div class="boton-grupo">
          <button type="submit" class="boton">Registrar</button>
          <a class="boton boton-secundario" href="login.html">Ya tengo cuenta</a>
        </div>
      </form>
    </section>
  </main>

  <footer class="pie">
    <div class="contenedor"><small>OsintKit — prototipo baja fidelidad</small></div>
  </footer>
</body>
</html>
