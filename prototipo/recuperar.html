<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña — OsintKit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="encabezado">
    <div class="contenedor encabezado__inner">
      <a class="marca" href="login.html">OsintKit</a>
    </div>
  </header>

  <main class="contenedor principal">
    <section class="seccion">
      <h1>Recuperar contraseña</h1>
      <form class="formulario" action="login.html" method="get">
        <div class="campo">
          <label for="correo">Correo registrado</label>
          <input type="email" id="correo" name="correo" required>
        </div>
        <div class="alerta">Se enviará un enlace de recuperación al correo registrado.</div>
        <div class="boton-grupo">
          <button type="submit" class="boton">Enviar enlace</button>
          <a class="boton boton-secundario" href="login.html">Volver al login</a>
        </div>
      </form>
    </section>
  </main>

  <footer class="pie">
    <div class="contenedor"><small>OsintKit — prototipo baja fidelidad</small></div>
  </footer>
</body>
</html>
